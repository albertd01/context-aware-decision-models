seed: 42

dataset:
  num_cases: 200
  path: data/generated/cases.jsonl
  distractors_per_case: 10     # irrelevant facts mixed into every case
  hide_background_prob: 0.3    # chance a non-decisive diagnostic fact is left unknown
  hard_case_prob: 0.3          # chance a case also carries a tempting non-decisive signal

retrieval:
  type: tfidf
  k: 3

# Named model presets; select one with `run --model <name>`.
models:
  rules:
    backend: rules
  qwen-4b:
    backend: simple_jev
    url: https://simple-jev-demo-api.featherless.ai/v1
    model: featherless-ai/Qwen3.5-4B-classifier
    min_interval_s: 0.6          # demo API allows 2 requests/s
  qwen-27b:                      # large-model reference
    backend: simple_jev
    url: https://simple-jev-demo-api.featherless.ai/v1
    model: featherless-ai/Qwen3.8-27B-classifier
    min_interval_s: 0.6
  local:
    backend: simple_jev
    url: http://127.0.0.1:8000/v1
    model: Qwen/Qwen3.5-2B       # must match the model the local server was started with

evaluation:
  results_dir: results
  save_raw_outputs: true
